services:
  ethans-eggs:
    image: ghcr.io/blaskovicz/ethanseggs:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "4000"
      TZ: America/New_York  # "today" for daily egg lock must be household-local, not UTC
      DATABASE_URL: "file:/data/prod.db"
      JWT_SECRET_FILE: /run/secrets/jwt_secret
    volumes:
      - ${DATA_DIR:-/srv/ethans-eggs/data}:/data
    secrets:
      - jwt_secret
    networks:
      - default
      - gateway

networks:
  gateway:
    external: true

secrets:
  jwt_secret:
    file: ${JWT_SECRET_FILE:-./secrets/jwt_secret.txt}
