services:
  ethans-eggs:
    build: .
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: "4000"
      DATABASE_URL: "file:/data/prod.db"
      JWT_SECRET_FILE: /run/secrets/jwt_secret
    volumes:
      - ${DATA_DIR:-/srv/ethans-eggs/data}:/data
    secrets:
      - jwt_secret
    networks:
      - default
      - gateway

networks:
  gateway:
    external: true

secrets:
  jwt_secret:
    file: ${JWT_SECRET_FILE:-./secrets/jwt_secret.txt}
